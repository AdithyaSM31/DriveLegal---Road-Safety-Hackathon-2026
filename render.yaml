services:
  - type: web
    name: drivelegal-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: PYTHONPATH
        value: /app
      - key: PORT
        value: "8000"
      # Set your Vercel frontend URL here after deployment
      - key: CORS_ORIGINS
        value: https://drivelegal.vercel.app

    # Persistent disk — survives restarts, keeps SQLite + Chroma index intact
    disk:
      name: drivelegal-data
      mountPath: /app/data
      sizeGB: 1
