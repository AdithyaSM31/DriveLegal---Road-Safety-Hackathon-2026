services:
  - type: web
    name: drivelegal-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: PYTHONPATH
        value: /app
      # Render sets PORT automatically — do NOT override it here
      - key: CORS_ORIGINS
        value: https://drivelegal-road-safety-hackathon-20.vercel.app

    # Persistent disk — survives restarts, keeps SQLite + Chroma index intact
    disk:
      name: drivelegal-data
      mountPath: /app/data
      sizeGB: 1
